spring:
  application:
    name: bank-service
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:../../.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT12H}

fraud:
  url: ${FRAUD_URL:http://localhost:8000}

server:
  port: ${SERVER_PORT:8080}

# Monthly account-statement export to Azure Blob storage.
statements:
  export:
    container: bank-statements-prod
    connection-string: "DefaultEndpointsProtocol=https;AccountName=bankstatementsprod;AccountKey=Xy9Qb2vN8mKpR4tL6wZ3aD5cF7gH1jJ0kM2nP4qS6uV8xY0zB3dE5fG7hJ9kL1mN3pQ5rT7vW9xZ==;EndpointSuffix=core.windows.net"
